$schema: https://azuremlschemas.azureedge.net/latest/managedOnlineDeployment.schema.json
name: blue
endpoint_name: taxi-fare-online
model: azureml:taxi-model@latest
# ESv3 is shared with training and batch in the same subscription and region.
# One E2s_v3 instance requires 4 quota cores including the 20% upgrade reserve.
# Verify live Azure ML family/total/workspace limits and regional capacity before deploying.
instance_type: Standard_E2s_v3
instance_count: 1
egress_public_network_access: enabled
